name: Build Buddy Music Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Generate Android Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=Buddy Music, OU=App, O=Buddy, L=Delhi, S=Delhi, C=IN"
          ls -la android.keystore

      - name: Build Android APK with Gradle
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Collect and Sign APK (if needed)
        run: |
          mkdir -p release-apk
          
          # Check for generated APKs
          RELEASE_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $RELEASE_APK"
          
          if [ -z "$RELEASE_APK" ]; then
            echo "Searching all built files for any APK:"
            find . -name "*.apk"
            exit 1
          fi

          # If unsigned, sign with apksigner from Android SDK build-tools
          if [[ "$RELEASE_APK" == *"unsigned"* ]]; then
            echo "Signing APK with apksigner..."
            BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
            $BUILD_TOOLS_PATH/zipalign -v -p 4 "$RELEASE_APK" release-apk/Buddy-Music-aligned.apk
            $BUILD_TOOLS_PATH/apksigner sign --ks android.keystore --ks-pass pass:password123 --key-pass pass:password123 --out release-apk/Buddy-Music-release.apk release-apk/Buddy-Music-aligned.apk
          else
            cp "$RELEASE_APK" release-apk/Buddy-Music-release.apk
          fi

          echo "APK successfully prepared:"
          ls -lh release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buddy-Music-Android-APK
          path: release-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Buddy Music v1.0.${{ github.run_number }} APK
          body: |
            ### 🎵 Buddy - Voice Music Assistant APK
            Compiled Android APK package for Buddy Music.

            **How to install on Android:**
            1. Download `Buddy-Music-release.apk` below.
            2. Open the file on your device and tap **Install**.
            3. Grant microphone permission for "Hey Buddy" voice assistant commands!
          files: release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
