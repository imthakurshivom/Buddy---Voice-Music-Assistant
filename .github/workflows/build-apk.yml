name: Build Buddy Music Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI & Configure Non-Interactive Paths
        run: |
          npm install -g @bubblewrap/cli
          
          # Explicitly configure Bubblewrap paths non-interactively
          npx @bubblewrap/cli updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME" || true
          
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          echo "Bubblewrap config.json verified:"
          cat ~/.bubblewrap/config.json
          npx @bubblewrap/cli doctor || true

      - name: Generate Android Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=Buddy Music, OU=App, O=Buddy, L=Delhi, S=Delhi, C=IN"

      - name: Serve Local Assets for Build & Update TWA Manifest
        run: |
          # Start background local server to serve public icons
          python3 -m http.server 8089 --directory public &
          SERVER_PID=$!
          sleep 2

          # Update twa-manifest to use local icon during build
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            manifest.iconUrl = "http://127.0.0.1:8089/icon-512.png";
            manifest.maskableIconUrl = "http://127.0.0.1:8089/icon-512.png";
            manifest.webManifestUrl = "http://127.0.0.1:8089/manifest.json";
            fs.writeFileSync("twa-manifest.json", JSON.stringify(manifest, null, 2));
            console.log("Updated twa-manifest.json with build-time assets URL");
          '

      - name: Generate Android Project from Manifest
        run: |
          echo "Updating Android project from twa-manifest..."
          npx @bubblewrap/cli update --skipVersionUpgrade

      - name: Compile Android APK via Gradle
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: password123
          BUBBLEWRAP_KEY_PASSWORD: password123
        run: |
          echo "Building APK..."
          if npx @bubblewrap/cli build --skipPwaValidation; then
            echo "Bubblewrap build succeeded!"
          else
            echo "Bubblewrap CLI build hit an issue, falling back to direct Gradle assembleRelease..."
            chmod +x gradlew || true
            ./gradlew assembleRelease || ./gradlew assembleDebug
          fi

      - name: Collect and Prepare APKs
        run: |
          mkdir -p release-apk
          # Find any APK generated (Release or Debug or TWA)
          find . -name "*.apk" -not -path "*/node_modules/*" -exec cp {} release-apk/Buddy-Music-release.apk \;
          echo "Listing compiled APK in release-apk/:"
          ls -lh release-apk/
          if [ ! -f release-apk/Buddy-Music-release.apk ]; then
            echo "Searching all built files for debugging:"
            find . -name "*.apk"
          fi

      - name: Upload APK Artifact (Download from GitHub Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: Buddy-Music-Android-APK
          path: release-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Buddy Music v1.0.${{ github.run_number }} APK
          body: |
            ### 🎵 Buddy - Voice Music Assistant APK
            Here is your freshly compiled Android APK!

            **How to install:**
            1. Download `Buddy-Music-release.apk` below.
            2. Open the file on your Android phone and tap **Install**.
            3. Enjoy hands-free music control with "Hey Buddy"!
          files: release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
