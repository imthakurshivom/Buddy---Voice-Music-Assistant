name: Build Buddy Music Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Generate Android Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=Buddy Music, OU=App, O=Buddy, L=Delhi, S=Delhi, C=IN"

      - name: Build Android APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate and Prepare Release APK
        run: |
          mkdir -p release-apk
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Located APK at: $APK_PATH"
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file generated!"
            find . -name "*.apk"
            exit 1
          fi
          cp "$APK_PATH" release-apk/Buddy-Music-release.apk
          ls -lh release-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buddy-Music-Android-APK
          path: release-apk/Buddy-Music-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Buddy Music v1.0.${{ github.run_number }} (Android APK)
          body: |
            ### 🎵 Buddy - Voice Music Assistant APK
            Direct Android APK release built by GitHub Actions.

            **Installation Instructions:**
            1. Download **Buddy-Music-release.apk** from the Assets below.
            2. Open the file on your Android device and tap **Install**.
            3. Enjoy hands-free music control with "Hey Buddy"!
          files: release-apk/Buddy-Music-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
